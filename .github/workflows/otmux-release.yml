# Publishes otmux when a version tag like otmux/v1.0.0 is pushed:
#
#   1. a release for that version, with archives and bare binaries for
#      Windows, Linux and macOS;
#   2. the rolling "otmux (latest)" release (tag otmux/latest), whose files
#      always have the same names, so these links never change:
#        .../releases/download/otmux/latest/otmux-windows-amd64.exe
#
# Builds run on Windows with release.ps1 (the same script works locally).
# The tests that must pass are the Windows ones; Linux and macOS are
# cross-compiled from the same code.
name: otmux release

on:
  push:
    tags: ['otmux/v*'] # not otmux/latest, which this workflow moves itself

permissions:
  contents: write

concurrency:
  group: otmux-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: otmux

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: otmux/go.mod
          cache-dependency-path: otmux/go.sum
      - name: test
        run: go test -count=1 ./...

      - name: build
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^otmux/v', ''
          ./release.ps1 -Version $version

      - name: publish the version release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#otmux/v}"
          # Release notes: this version's section of CHANGELOG.md, then how
          # to install.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md |
            grep -v '^\[.*\]: ' | sed '/./,$!d' > notes.md
          [ -s notes.md ] || echo "otmux $version" > notes.md
          cat >> notes.md <<EOF

          ## Install

          **Windows**, in PowerShell:

          \`\`\`powershell
          irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/otmux/install.ps1 | iex
          \`\`\`

          Or download the file for your platform below; \`checksums.txt\` has their SHA-256 sums.
          On macOS and Linux, \`chmod +x\` the file and put it on your PATH as \`otmux\`.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "otmux $version" --notes-file notes.md --latest

      - name: update the rolling otmux/latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          trap 'echo "::error title=rolling release::updating otmux/latest failed at line $LINENO"' ERR
          version="${GITHUB_REF_NAME#otmux/v}"
          # Every file the rolling release serves must exist before anything
          # is changed, so a broken build can't leave the links dead.
          for f in version.txt checksums.txt otmux-windows-amd64.exe otmux-windows-arm64.exe \
                   otmux-linux-amd64 otmux-linux-arm64 otmux-darwin-amd64 otmux-darwin-arm64; do
            test -s "dist/$f" || { echo "::error title=rolling release::dist/$f is missing"; exit 1; }
          done
          test "$(cat dist/version.txt)" = "$version"
          git tag -f otmux/latest "$GITHUB_SHA"
          git push -f origin otmux/latest
          notes="Always the newest otmux; currently **$version** ([release notes](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)). The file names here never change, so links to them always download the latest version."
          # Recreate it rather than editing it in place: the release keeps its
          # tag, and the download links work again as soon as it's created.
          gh release delete otmux/latest --yes || true
          gh release create otmux/latest dist/otmux-* dist/checksums.txt dist/version.txt \
            --verify-tag --title "otmux (latest: $version)" --notes "$notes" --latest=false
