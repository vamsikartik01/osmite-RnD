name: otmux CI

on:
  push:
    branches: [main]
    paths: ['otmux/**', '.github/workflows/otmux-*.yml']
  pull_request:
    paths: ['otmux/**', '.github/workflows/otmux-*.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: otmux

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows tests must pass; Linux and macOS run too, but don't block.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: otmux/go.mod
          cache-dependency-path: otmux/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test
        shell: bash
        run: |
          race=""
          [ "$RUNNER_OS" != "Windows" ] && race="-race"
          if go test -count=1 $race ./... > test.log 2>&1; then
            grep -E '^(ok|---)' test.log || true
            exit 0
          fi
          cat test.log
          # Publish the failures as annotations, which anyone can read on the
          # run page (raw logs need a GitHub login).
          annotate() { # title, then lines on stdin
            msg=$(head -c 30000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            [ -n "$msg" ] && echo "::error title=$1::$msg"
          }
          grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' test.log | head -60 | annotate "go test failed on $RUNNER_OS"
          awk '/WARNING: DATA RACE/{n=60} n-->0' test.log | head -120 | annotate "data race on $RUNNER_OS"
          exit 1

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: otmux/go.mod
          cache-dependency-path: otmux/go.sum
      - name: build every release target
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/otmux
          done
